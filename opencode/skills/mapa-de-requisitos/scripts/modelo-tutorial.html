<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>__TITULO__</title>
<style>
  /* Página para impressão em A4 retrato: as margens e o rodapé vêm do imprimir.mjs. */
  :root { --marca: __MARCA__; --texto: #1f2328; --suave: #5b636e; --borda: #dfe3e8; --fundo: #f6f7f9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { color: var(--texto); font: 10.5pt/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  strong { font-weight: 600; }

  /* Capa */
  .capa {
    height: 262mm; display: flex; flex-direction: column; justify-content: center; padding: 0 8mm;
    border-left: 4mm solid var(--marca); break-after: page;
  }
  .capa .logo { max-width: 60mm; max-height: 30mm; object-fit: contain; align-self: flex-start; margin-bottom: 18mm; }
  .capa h1 { margin: 0; font-size: 30pt; line-height: 1.15; }
  .capa .subtitulo { margin: 4mm 0 0; font-size: 14pt; color: var(--suave); }
  .capa .publico { margin: 14mm 0 0; max-width: 140mm; color: var(--suave); }

  /* Apresentação e sumário */
  .inicio { break-after: page; }
  .inicio h1 { font-size: 18pt; margin: 0 0 4mm; color: var(--marca); }
  .inicio > p { margin: 0 0 3mm; }
  .sumario { margin: 8mm 0 0; padding: 0; list-style: none; }
  .sumario > li { margin: 0 0 3mm; font-weight: 600; break-inside: avoid; }
  .sumario ol { list-style: none; margin: 1.5mm 0 0 6mm; padding: 0; font-weight: 400; }
  .sumario ol li { padding: .6mm 0; border-bottom: 1px dotted var(--borda); }

  /* Seção e caso de uso: cada caso começa numa página nova */
  .caso { break-before: page; }
  .caso:first-of-type { break-before: auto; }
  .secao { margin: 0 0 6mm; padding: 0 0 4mm; border-bottom: 2px solid var(--marca); }
  .secao span { color: var(--marca); font-size: 9pt; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .secao h1 { margin: 1mm 0 1mm; font-size: 20pt; }
  .secao p { margin: 0; color: var(--suave); }
  .caso h2 { margin: 0 0 2mm; font-size: 15pt; break-after: avoid; }
  .objetivo { margin: 0 0 5mm; color: var(--suave); }
  .resultado { break-inside: avoid; margin: 4mm 0 0; padding: 3mm 4mm; background: var(--fundo); border-left: 1mm solid var(--marca); }

  /* Tela: a captura com os números dos passos, e a lista dos passos logo abaixo */
  .tela { break-inside: avoid; margin: 0 0 7mm; }
  .tela h3 { margin: 0 0 1mm; font-size: 11.5pt; }
  .tela .etapa {
    display: inline-block; margin-right: 2mm; padding: .3mm 2mm; border-radius: 1mm; background: var(--marca); color: #fff;
    font-size: 8pt; font-weight: 600; vertical-align: 1px;
  }
  .resumo { margin: 0 0 2.5mm; color: var(--suave); font-size: 9.5pt; }
  figure { position: relative; margin: 0 0 3mm; border: 1px solid var(--borda); border-radius: 1.5mm; overflow: hidden; }
  figure img { display: block; width: 100%; }
  .alvo { position: absolute; border: 1.5px solid var(--marca); border-radius: 5px; }
  .alvo span, .numero {
    display: inline-flex; align-items: center; justify-content: center; width: 5.4mm; height: 5.4mm; border-radius: 50%;
    background: var(--marca); color: #fff; font-size: 8pt; font-weight: 700; line-height: 1;
  }
  .alvo span { position: absolute; top: 50%; margin-top: -2.7mm; box-shadow: 0 0 0 1.5px #fff; }
  .alvo.esquerda span { right: 100%; margin-right: 1mm; }
  .alvo.canto span { left: -2.2mm; top: -2.2mm; margin-top: 0; }
  .numero.sem-alvo { background: #fff; color: var(--marca); border: 1.5px solid var(--marca); }
  .passos { list-style: none; margin: 0; padding: 0; }
  .passos li { display: flex; gap: 2.5mm; align-items: flex-start; margin: 0 0 1.6mm; }
  .passos .numero { flex: none; margin-top: .2mm; }
</style>
</head>
<body>
<section class="capa">__CAPA__</section>
<section class="inicio">
  <h1>Como usar este guia</h1>
  __APRESENTACAO__
  <h1 style="margin-top:10mm">Sumário</h1>
  <ol class="sumario">__SUMARIO__</ol>
</section>
__CORPO__
</body>
</html>
